<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — ComboMaster Fitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Oswald', 'sans-serif'] },
                    colors: {
                        brand: {
                            gold: 'rgb(var(--gold-rgb) / <alpha-value>)',
                            dark: 'var(--bg-base)',
                            darker: 'var(--bg-secondary)',
                            card: 'var(--card-bg-solid)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-base: #050505; --bg-secondary: #0F0F0F; --bg-card: rgba(26,26,26,0.6);
            --text-main: #F5F5F0; --text-muted: #a3a3a3; --border-color: rgba(255,255,255,0.05);
            --gold-rgb: 212 168 83; --gold: rgb(var(--gold-rgb)); --gold-accent: #B8943F;
            --card-bg-solid: #1A1A1A; --nav-bg: rgba(5,5,5,0.9);
            --toast-bg: rgba(26,26,26,0.9); --input-bg: #0F0F0F;
        }
        body.light-theme {
            --bg-base: #f8f9fc; --bg-secondary: #ffffff; --bg-card: rgba(255,255,255,0.8);
            --text-main: #1e1e2a; --text-muted: #4b5563; --border-color: rgba(0,0,0,0.08);
            --gold-rgb: 184 134 11; --gold-accent: #9a7209; --card-bg-solid: #ffffff;
            --nav-bg: rgba(255,255,255,0.95); --toast-bg: rgba(255,255,255,0.95); --input-bg: #ffffff;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{overflow-x:hidden;max-width:100vw;scroll-behavior:smooth}
        body{font-size:1.125rem;background-color:var(--bg-base);color:var(--text-main);font-family:'Inter',sans-serif;transition:background-color .3s ease,color .3s ease}
        .font-display{font-family:'Oswald',sans-serif}
        nav{z-index:50;background-color:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .4s ease}
        nav.nav-scrolled{background-color:rgba(5,5,5,.98);box-shadow:0 4px 30px rgba(0,0,0,.5)}
        body.light-theme nav.nav-scrolled{background-color:rgba(255,255,255,.98);box-shadow:0 4px 30px rgba(0,0,0,.08)}
        .glass-card{background:var(--bg-card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border-color);transition:all .3s ease}
        .text-muted-custom{color:var(--text-muted)}
        .text-gradient{background:linear-gradient(to right,var(--gold),#f5dfa0,var(--gold));background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .text-gold{color:var(--gold)}
        .btn-gold{background:var(--gold);color:#050505;transition:all 150ms ease;cursor:pointer;border:none;font-weight:600}
        .btn-gold:hover{background:var(--gold-accent);box-shadow:0 0 30px rgba(var(--gold-rgb),.5);transform:translateY(-2px)}
        body.light-theme .btn-gold{color:#fff}
        .btn-outline{border:1px solid rgba(var(--gold-rgb),.5);color:var(--gold);background:0 0;transition:all 150ms ease;cursor:pointer;font-weight:600}
        .btn-outline:hover{background:rgba(var(--gold-rgb),.1);border-color:var(--gold);transform:translateY(-2px);box-shadow:0 0 20px rgba(var(--gold-rgb),.15)}
        .toast{position:fixed;bottom:2rem;right:2rem;z-index:9999;transform:translateY(100px);opacity:0;transition:all .4s ease;background:var(--toast-bg);backdrop-filter:blur(12px);border:1px solid var(--border-color)}
        .toast.show{transform:translateY(0);opacity:1}
        @keyframes heroFadeIn{from{opacity:0;transform:translateY(30px);filter:blur(6px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
        @keyframes wordSlideUp{from{opacity:0;transform:translateY(100%);filter:blur(10px)}60%{opacity:1;filter:blur(0)}80%{transform:translateY(-4%)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
        @keyframes lineExpand{from{width:0;opacity:0}to{width:60px;opacity:1}}
        @keyframes heroImageZoom{from{transform:scale(1.15)}to{transform:scale(1.05)}}
        @keyframes particleFloat{0%{opacity:0;transform:translateY(0) translateX(0) scale(0)}15%{opacity:.7;transform:scale(1)}50%{opacity:.4}100%{opacity:0;transform:translateY(-200px) translateX(var(--drift,20px)) scale(0)}}
        @keyframes goldShimmer{0%{background-position:200% center}100%{background-position:-200% center}}
        @keyframes cardReveal{from{opacity:0;transform:translateY(40px) scale(.95);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
        @keyframes pulse-gold{0%,100%{box-shadow:0 0 0 0 rgba(var(--gold-rgb),.4)}50%{box-shadow:0 0 20px 5px rgba(var(--gold-rgb),.15)}}
        .hero-animate{opacity:0;transform:translateY(30px);filter:blur(6px);animation:heroFadeIn .9s var(--delay,0s) cubic-bezier(.16,1,.3,1) both}
        .hero-word{display:inline-block;opacity:0;transform:translateY(100%);filter:blur(10px);animation:wordSlideUp 1s calc(.5s + var(--i,0)*.18s) cubic-bezier(.16,1,.3,1) both}
        .hero-word.text-gradient{animation:wordSlideUp 1s calc(.5s + var(--i,0)*.18s) cubic-bezier(.16,1,.3,1) both,goldShimmer 3s 2s ease-in-out 1 both}
        .hero-line{width:0;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);animation:lineExpand .8s var(--delay,0s) cubic-bezier(.16,1,.3,1) both}
        .hero-bg-img{animation:heroImageZoom 25s ease-out forwards}
        .particle{position:absolute;width:var(--size,3px);height:var(--size,3px);background:var(--gold);border-radius:50%;box-shadow:0 0 8px var(--gold),0 0 20px rgba(var(--gold-rgb),.3);opacity:0;animation:particleFloat var(--dur,12s) var(--d,0s) infinite ease-in-out}
        .pulse-gold{animation:pulse-gold 3s infinite}
        .card-reveal{opacity:0;transform:translateY(40px) scale(.95);filter:blur(8px);animation:cardReveal 1s 1.4s cubic-bezier(.16,1,.3,1) both}
        .hero-title{font-size:clamp(1.8rem,5vw,4rem);line-height:.95;letter-spacing:-.02em}
        @media(min-width:768px){.hero-title-line{white-space:nowrap}}
        .form-input{background-color:var(--input-bg);border:1px solid var(--border-color);border-radius:.5rem;padding:.5rem .75rem;font-size:.8125rem;color:var(--text-main);transition:all .2s ease;outline:none;font-family:'Inter',sans-serif;line-height:1.5;width:100%}
        .form-input::placeholder{color:var(--text-muted);opacity:.5}
        .form-input:focus{border-color:rgba(var(--gold-rgb),.5);box-shadow:0 0 0 2px rgba(var(--gold-rgb),.08)}
        .theme-toggle-btn{background:var(--bg-card);border:1px solid var(--border-color);border-radius:9999px;padding:8px;display:flex;align-items:center;justify-content:center;transition:all .2s ease;cursor:pointer}
        .theme-toggle-btn:hover{border-color:var(--gold);transform:scale(1.05)}
        button,a,[role="button"]{pointer-events:auto!important;cursor:pointer}
        nav button,nav a{position:relative;z-index:60}
        ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg-base)}::-webkit-scrollbar-thumb{background:var(--card-bg-solid);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--gold)}
        body.light-theme ::-webkit-scrollbar-thumb{background:#cbd5e1}body.light-theme ::-webkit-scrollbar-thumb:hover{background:var(--gold)}
        @media(prefers-reduced-motion:reduce){.hero-animate,.hero-word,.hero-line,.particle,.hero-bg-img,.card-reveal{animation:none!important;opacity:1!important;transform:none!important;filter:none!important}}
    </style>
</head>
<body class="font-sans antialiased">

    <div id="toast" class="toast glass-card rounded-xl px-6 py-4 flex items-center gap-3">
        <i data-lucide="check-circle" class="w-5 h-5 text-green-500"></i>
        <span id="toast-message" class="text-sm font-medium"></span>
    </div>

    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between py-4">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="images/gym_logo.jpg" alt="ComboMaster Fitness" class="h-10 w-auto">
                    <div class="hidden sm:block">
                        <span class="font-display text-xl tracking-wide font-medium text-gold group-hover:text-white transition-colors">COMBOMASTER</span>
                        <span class="block text-[0.6rem] tracking-[0.3em] uppercase text-muted-custom -mt-1">FITNESS</span>
                    </div>
                </a>
                <div class="hidden lg:flex items-center gap-4">
                    <button id="theme-toggle-desktop" class="theme-toggle-btn" aria-label="Toggle theme">
                        <i data-lucide="moon" class="w-5 h-5 text-gold" id="theme-icon-desktop"></i>
                    </button>
                    <a href="login.html" class="text-sm text-muted-custom hover:text-gold transition-colors flex items-center gap-1.5">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Login
                    </a>
                </div>
                <div class="flex items-center gap-2 lg:hidden">
                    <button id="theme-toggle-mobile" class="theme-toggle-btn p-2" aria-label="Toggle theme">
                        <i data-lucide="moon" class="w-5 h-5 text-gold" id="theme-icon-mobile"></i>
                    </button>
                    <a href="login.html" class="p-2 text-muted-custom hover:text-gold transition-colors" aria-label="Back to Login">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <section class="relative min-h-screen flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0">
            <img src="images/IMG-20260524-WA0037.jpg" alt="" class="hero-bg-img w-full h-full object-cover select-none" draggable="false" onerror="this.src='https://picsum.photos/seed/darkgymlogin/1920/1080.jpg'">
        </div>
        <div class="absolute inset-0 bg-black/70"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-[#050505]/40 to-[#050505]/70"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-[#050505]/80 via-transparent to-[#050505]"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] rounded-full bg-amber-500/[0.03] blur-[150px] pointer-events-none"></div>
        <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
            <span class="particle" style="left:12%;top:50%;--size:3px;--d:0s;--dur:14s;--drift:20px"></span>
            <span class="particle" style="left:28%;top:25%;--size:2px;--d:3s;--dur:12s;--drift:-12px"></span>
            <span class="particle" style="left:68%;top:18%;--size:3px;--d:1s;--dur:16s;--drift:18px"></span>
            <span class="particle" style="left:85%;top:55%;--size:2px;--d:5s;--dur:11s;--drift:-25px"></span>
        </div>

        <div class="relative z-10 w-full max-w-sm mx-auto px-4 pt-20 pb-8">

            <div class="text-center mb-6">
                <div class="hero-animate" style="--delay:0.1s">
                    <a href="index.html" class="inline-block">
                        <img src="images/gym_logo.jpg" alt="ComboMaster Fitness" class="h-14 w-auto mx-auto mb-4">
                    </a>
                </div>
                <div class="flex justify-center mb-5 hero-animate" style="--delay:0.3s"><div class="hero-line" style="--delay:0.4s"></div></div>
                <h1 class="font-display font-semibold tracking-tight mb-2 hero-title">
                    <span class="hero-title-line">
                        <span class="hero-word" style="--i:0">RESET</span>
                        <span class="hero-word text-gradient" style="--i:1">PASSWORD</span>
                    </span>
                </h1>
                <div class="hero-animate" style="--delay:1.1s">
                    <p class="text-xs text-muted-custom">Enter your email and we'll send you a reset link.</p>
                </div>
            </div>

            <!-- Card -->
            <div class="glass-card rounded-2xl p-5 sm:p-6 card-reveal" id="reset-card">
                <form id="resetForm" class="space-y-3.5" novalidate>
                    <div>
                        <label for="email" class="text-xs font-medium text-muted-custom mb-1 block">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                                <i data-lucide="mail" class="w-3.5 h-3.5 text-muted-custom"></i>
                            </div>
                            <input type="email" id="email" name="email" required class="form-input pl-8" placeholder="you@example.com" autocomplete="email">
                        </div>
                    </div>
                    <button type="submit" class="btn-gold w-full py-2.5 rounded-lg text-xs font-semibold tracking-wide uppercase flex items-center justify-center gap-2 mt-1" id="resetButton">
                        <i data-lucide="send" class="w-3.5 h-3.5"></i>
                        <span id="resetButtonText">Send Reset Link</span>
                        <svg id="resetSpinner" class="animate-spin h-3.5 w-3.5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>
                <div class="mt-4 text-center text-xs text-muted-custom">
                    Remember your password?
                    <a href="login.html" class="text-gold font-semibold hover:underline">Sign In</a>
                </div>
            </div>

            <!-- Success State (hidden by default) -->
            <div class="glass-card rounded-2xl p-5 sm:p-6 card-reveal hidden" id="success-card">
                <div class="text-center py-4">
                    <div class="w-14 h-14 rounded-full bg-green-500/10 flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="mail-check" class="w-7 h-7 text-green-400"></i>
                    </div>
                    <h3 class="font-display text-lg font-bold mb-2">Check Your Inbox</h3>
                    <p class="text-xs text-muted-custom mb-5">We've sent a password reset link to your email address. It may take a minute to arrive.</p>
                    <a href="login.html" class="btn-gold w-full py-2.5 rounded-lg text-xs font-semibold tracking-wide uppercase inline-flex items-center justify-center gap-2">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Login
                    </a>
                </div>
            </div>

            <div class="mt-5 text-center lg:hidden hero-animate" style="--delay:2s">
                <a href="login.html" class="text-xs text-muted-custom hover:text-gold transition-colors inline-flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i> Back to Login
                </a>
            </div>
        </div>
    </section>

    <script>
        function initTheme(){var s=localStorage.getItem('theme');if(s==='light')document.body.classList.add('light-theme');updateThemeIcons()}
        function toggleTheme(){document.body.classList.toggle('light-theme');var l=document.body.classList.contains('light-theme');localStorage.setItem('theme',l?'light':'dark');updateThemeIcons()}
        function updateThemeIcons(){var l=document.body.classList.contains('light-theme');var n=l?'sun':'moon';var d=document.getElementById('theme-icon-desktop');if(d)d.setAttribute('data-lucide',n);var m=document.getElementById('theme-icon-mobile');if(m)m.setAttribute('data-lucide',n);if(window.lucide)lucide.createIcons()}
        function showToast(msg){var t=document.getElementById('toast');var e=document.getElementById('toast-message');if(t&&e){e.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},3000)}}
        function initNavScroll(){var n=document.getElementById('navbar');if(!n)return;var t=false;window.addEventListener('scroll',function(){if(!t){requestAnimationFrame(function(){n.classList.toggle('nav-scrolled',window.scrollY>60);t=false});t=true}})}

        document.addEventListener('DOMContentLoaded',function(){
            initTheme();initNavScroll();
            var d=document.getElementById('theme-toggle-desktop');var m=document.getElementById('theme-toggle-mobile');
            if(d)d.addEventListener('click',toggleTheme);if(m)m.addEventListener('click',toggleTheme);

            // Reset form
            var form=document.getElementById('resetForm');
            var btn=document.getElementById('resetButton');
            var btnText=document.getElementById('resetButtonText');
            var spinner=document.getElementById('resetSpinner');
            var resetCard=document.getElementById('reset-card');
            var successCard=document.getElementById('success-card');

            if(form){
                form.addEventListener('submit',function(e){
                    e.preventDefault();
                    var email=document.getElementById('email').value;
                    if(!email){showToast('Please enter your email address.');return}
                    btn.disabled=true;btnText.textContent='Sending...';spinner.classList.remove('hidden');
                    setTimeout(function(){
                        resetCard.classList.add('hidden');
                        successCard.classList.remove('hidden');
                        // Re-trigger animation
                        successCard.style.animation='none';successCard.offsetHeight;successCard.style.animation='';
                        if(window.lucide)lucide.createIcons();
                        showToast('Reset link sent!');
                        btn.disabled=false;btnText.textContent='Send Reset Link';spinner.classList.add('hidden');
                    },1500);
                });
            }

            if(window.lucide)lucide.createIcons();
        });
    </script>
</body>
</html>
