
name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate PHP syntax
        run: |
          if [ -d api ]; then
            find api -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install project dependencies
        run: npm install

      - name: Validate backend JavaScript syntax
        run: |
          find backend -type f -name '*.js' \
            -not -path '*/node_modules/*' \
            -print0 | xargs -0 -r -n1 node --check
            
